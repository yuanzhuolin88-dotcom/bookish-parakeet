<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>贪吃蛇 · Smooth</title>
<style>
:root{--ink:#f4f7fb;--muted:#98a9c4;--panel:rgba(18,28,48,.78);--line:rgba(166,198,242,.16);--mint:#6cf0b0;--mint2:#b9ffe1;--pink:#ff7891}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#070c17;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 18% 18%,rgba(77,137,255,.18),transparent 29%),radial-gradient(circle at 85% 15%,rgba(213,77,163,.13),transparent 28%),radial-gradient(circle at 50% 100%,rgba(70,230,171,.11),transparent 31%);pointer-events:none}
.app{width:min(94vw,700px);position:relative}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;color:#07131a;background:linear-gradient(145deg,var(--mint2),var(--mint));box-shadow:0 8px 24px rgba(108,240,176,.25);font-size:25px}.title{margin:0;font-size:clamp(1.75rem,5vw,2.6rem);letter-spacing:-.05em}.tag{margin:4px 0 0;color:var(--muted);font-size:.85rem}.stats{display:flex;gap:9px}.stat{min-width:88px;padding:9px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(20,31,53,.65);backdrop-filter:blur(14px);text-align:center}.stat small{display:block;color:var(--muted);font-size:.7rem}.stat b{display:block;margin-top:2px;font-size:1.35rem;letter-spacing:.02em}
.panel{position:relative;padding:12px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(24,38,64,.9),rgba(10,17,31,.92));box-shadow:0 28px 90px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.06)}canvas{display:block;width:100%;aspect-ratio:1;border-radius:20px;background:#0b1525;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 14px 38px rgba(0,0,0,.2)}
.overlay{position:absolute;inset:12px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(180deg,rgba(5,11,22,.38),rgba(5,10,20,.82));backdrop-filter:blur(7px);text-align:center;padding:24px;transition:opacity .25s,visibility .25s}.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.modal{max-width:340px}.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;color:var(--mint2);background:rgba(108,240,176,.1);border:1px solid rgba(108,240,176,.23);font-size:.72rem;font-weight:700;letter-spacing:.05em}.modal h2{margin:13px 0 7px;font-size:clamp(1.6rem,5vw,2.1rem);letter-spacing:-.04em}.modal p{margin:0 0 18px;color:var(--muted);line-height:1.6;font-size:.92rem}
.controls{display:flex;justify-content:center;gap:10px;margin:16px 0 11px;flex-wrap:wrap}button{border:0;border-radius:13px;padding:11px 18px;color:#07131a;background:linear-gradient(145deg,var(--mint2),var(--mint));font:inherit;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(108,240,176,.14);transition:transform .15s,filter .15s,box-shadow .15s}button:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 12px 24px rgba(108,240,176,.2)}button.secondary{color:var(--ink);background:rgba(38,56,86,.86);box-shadow:none;border:1px solid var(--line)}button.audio-on{color:#07131a;background:linear-gradient(145deg,#ffe6a6,#ffc65d)}.hint{text-align:center;margin:0;color:var(--muted);font-size:.82rem}.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,42px);gap:7px;justify-content:center;margin:18px auto 0}.dpad button{padding:0;color:var(--ink);background:rgba(38,56,86,.86);font-size:1.1rem}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}@media(min-width:700px){.dpad{display:none}}@media(max-width:560px){body{padding:16px}.head{align-items:flex-start;flex-direction:column;gap:14px}.stats{width:100%}.stat{flex:1}.panel{padding:8px;border-radius:22px}.overlay{inset:8px;border-radius:16px}}
</style>
</head>
<body>
<main class="app">
<header class="head"><div class="brand"><div class="logo">✦</div><div><h1 class="title">贪吃蛇</h1><p class="tag">银币收集 · 金币奖励 · 轻松旋律</p></div></div><div class="stats"><div class="stat"><small>当前分数</small><b id="score">0</b></div><div class="stat"><small>银币</small><b id="silver">0</b></div><div class="stat"><small>最高分</small><b id="best">0</b></div></div></header>
<section class="panel"><canvas id="board" width="720" height="720" aria-label="贪吃蛇游戏区域"></canvas><div class="overlay" id="overlay"><div class="modal"><span class="pill" id="statePill">READY</span><h2 id="overlayTitle">准备好了吗？</h2><p id="overlayText">点击开始，然后用方向键或 WASD 控制蛇。</p><button id="overlayButton">开始游戏</button></div></div></section>
<div class="controls"><button id="pauseButton" class="secondary">暂停</button><button id="restartButton" class="secondary">重新开始</button><button id="musicButton" class="secondary">♫ 音乐：开</button></div><p class="hint">方向键 / WASD 移动　·　空格键暂停</p>
<div class="dpad" aria-label="触控方向键"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div>
</main>
<script>
(() => {
  const canvas = document.getElementById('board'), ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), silverEl = document.getElementById('silver');
  const overlay = document.getElementById('overlay'), statePill = document.getElementById('statePill');
  const overlayTitle = document.getElementById('overlayTitle'), overlayText = document.getElementById('overlayText'), overlayButton = document.getElementById('overlayButton');
  const pauseButton = document.getElementById('pauseButton'), restartButton = document.getElementById('restartButton'), musicButton = document.getElementById('musicButton');
  const N = 24, unit = canvas.width / N, stepMs = 112;
  const dirs = {up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  let snake, previousSnake, food, goldCoin=null, goldExpiresAt=0, silver=0, direction, queuedDirection, score, best, state, lastTime = 0, accumulator = 0, particles = [], scorePulse = 0;
  let audioCtx, musicTimer, musicOn = true;

  try { best = Number(localStorage.getItem('snake-best') || 0); } catch { best = 0; }
  bestEl.textContent = best;

  function reset() {
    snake = [{x:12,y:12},{x:11,y:12},{x:10,y:12},{x:9,y:12}];
    previousSnake = snake.map(p => ({...p}));
    direction = dirs.right; queuedDirection = dirs.right; score = 0; scoreEl.textContent = '0';
    food = spawnFood(); goldCoin=null; goldExpiresAt=0; silver=0; silverEl.textContent='0'; particles = []; scorePulse = 0; state = 'ready'; accumulator = 0; lastTime = performance.now();
    pauseButton.textContent = '暂停'; show('READY','准备好了吗？','点击开始，然后用方向键或 WASD 控制蛇。','开始游戏'); render(1);
  }
  function spawnFood() {
    let f;
    do { f = {x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}; } while (snake && snake.some(p => p.x === f.x && p.y === f.y));
    return f;
  }
  function burst(x,y,color){for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,size:2+Math.random()*3,color});}}
  function playNote(freq,duration=.18){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.035,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration+.03);}
  function startMusic(){if(!musicOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();clearInterval(musicTimer);let i=0;const notes=[261.6,329.6,392,329.6,293.7,349.2,440,349.2];playNote(notes[0]);musicTimer=setInterval(()=>playNote(notes[(i++)%notes.length],.22),420);}catch(e){musicOn=false;}}
  function eatTone(freq=620){if(audioCtx)playNote(freq,.12);}
  function start() {
    if (state === 'gameover') return;
    state = 'running'; hide(); pauseButton.textContent = '暂停'; startMusic();
  }
  function togglePause() {
    if (state === 'ready') { start(); return; }
    if (state === 'gameover') return;
    if (state === 'paused') { state = 'running'; hide(); pauseButton.textContent = '暂停'; lastTime = performance.now(); return; }
    state = 'paused'; pauseButton.textContent = '继续'; show('PAUSED','游戏已暂停，点击继续回到当前局。','继续游戏');
  }
  function gameOver() {
    state = 'gameover'; pauseButton.textContent = '暂停';
    if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('snake-best', best); } catch {} }
    show('GAME OVER','本局得分：' + score + '。按“重新开始”再来一局。','重新开始');
  }
  function setDirection(name) {
    if (state !== 'running') return;
    const next = dirs[name];
    if (!next || (next.x === -direction.x && next.y === -direction.y)) return;
    queuedDirection = next;
  }
  function update() {
    direction = queuedDirection;
    const head = {x:snake[0].x + direction.x,y:snake[0].y + direction.y};
    const hitWall = head.x < 0 || head.x >= N || head.y < 0 || head.y >= N;
    const growing = head.x === food.x && head.y === food.y;
    const body = growing ? snake : snake.slice(0,-1);
    const hitSelf = body.some(p => p.x === head.x && p.y === head.y);
    if (hitWall || hitSelf) { gameOver(); return; }
    previousSnake = snake.map(p => ({...p}));
    snake = [head, ...snake];
    const gotGold = goldCoin && head.x===goldCoin.x && head.y===goldCoin.y;
    if (growing) { score++; silver++; scoreEl.textContent = score; silverEl.textContent=silver; scorePulse = 1; burst(food.x*unit+unit/2, food.y*unit+unit/2,'#e7f3ff'); food = spawnFood(); eatTone(620); if(silver%5===0){goldCoin=spawnFood();goldExpiresAt=performance.now()+5000;burst(goldCoin.x*unit+unit/2,goldCoin.y*unit+unit/2,'#ffd45c');} } else snake.pop();
    if(goldCoin && performance.now()>goldExpiresAt) goldCoin=null;
    if(gotGold){score+=5;scoreEl.textContent=score;scorePulse=1;burst(head.x*unit+unit/2,head.y*unit+unit/2,'#ffd45c');goldCoin=null;eatTone(920);}
  }
  function loop(now) {
    const dt = Math.min(now - lastTime, 48); lastTime = now;
    if (state === 'running') { accumulator += dt; while (accumulator >= stepMs) { update(); accumulator -= stepMs; if (state !== 'running') break; } }
    render(state === 'running' ? accumulator / stepMs : 1); particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= .028; p.vy += .035; }); particles = particles.filter(p => p.life > 0); scorePulse *= .88; requestAnimationFrame(loop);
  }
  function render(alpha) {
    const bg = ctx.createLinearGradient(0,0,canvas.width,canvas.height); bg.addColorStop(0,'#12233c'); bg.addColorStop(.55,'#0b1729'); bg.addColorStop(1,'#08111f'); ctx.fillStyle=bg; ctx.fillRect(0,0,canvas.width,canvas.height);
    const glow = ctx.createRadialGradient(food.x*unit+unit/2,food.y*unit+unit/2,0,food.x*unit+unit/2,food.y*unit+unit/2,unit*3); glow.addColorStop(0,'rgba(255,120,145,.2)'); glow.addColorStop(1,'rgba(255,120,145,0)'); ctx.fillStyle=glow; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.save(); ctx.shadowColor='rgba(220,235,255,.9)'; ctx.shadowBlur=22; ctx.fillStyle='#dcecff'; ctx.beginPath(); ctx.arc(food.x*unit+unit/2,food.y*unit+unit/2,unit*.29,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#8fa9c9'; ctx.font='bold 15px system-ui'; ctx.textAlign='center'; ctx.fillText('S',food.x*unit+unit/2,food.y*unit+unit/2+5); ctx.restore();
    if(goldCoin){ctx.save();ctx.shadowColor='rgba(255,210,70,.95)';ctx.shadowBlur=30;ctx.fillStyle='#ffd45c';ctx.beginPath();ctx.arc(goldCoin.x*unit+unit/2,goldCoin.y*unit+unit/2,unit*.34,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a66a18';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText('G',goldCoin.x*unit+unit/2,goldCoin.y*unit+unit/2+5);ctx.restore();}
    const points = snake.map((part,i) => { const prev=previousSnake[i]||part; return {x:(prev.x+(part.x-prev.x)*alpha)*unit+unit/2,y:(prev.y+(part.y-prev.y)*alpha)*unit+unit/2}; });
    ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.shadowColor='rgba(45,210,144,.45)'; ctx.shadowBlur=22; ctx.strokeStyle='#208d68'; ctx.lineWidth=unit*.78; ctx.beginPath(); points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke();
    const bodyGrad=ctx.createLinearGradient(0,0,canvas.width,canvas.height); bodyGrad.addColorStop(0,'#c8ffe6'); bodyGrad.addColorStop(.35,'#75ebaf'); bodyGrad.addColorStop(1,'#24986d'); ctx.shadowBlur=8; ctx.strokeStyle=bodyGrad; ctx.lineWidth=unit*.67; ctx.beginPath(); points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke(); ctx.restore();
    points.slice(1).forEach((p,i)=>{ ctx.fillStyle='rgba(255,255,255,.18)'; ctx.beginPath(); ctx.ellipse(p.x-unit*.12,p.y-unit*.18,unit*.18,unit*.045,-.35,0,Math.PI*2); ctx.fill(); });
    const head = snake[0], smoothHead = points[0] || {x:head.x*unit+unit/2,y:head.y*unit+unit/2}, hx=smoothHead.x, hy=smoothHead.y;
    ctx.save();
    const fx=direction.x, fy=direction.y, sx=-fy, sy=fx;
    ctx.fillStyle='#17364b';
    const eyeForward=unit*.16, eyeSide=unit*.17, eyeR=unit*.065;
    const e1x=hx+fx*eyeForward+sx*eyeSide, e1y=hy+fy*eyeForward+sy*eyeSide, e2x=hx+fx*eyeForward-sx*eyeSide, e2y=hy+fy*eyeForward-sy*eyeSide;
    ctx.beginPath(); ctx.arc(e1x,e1y,eyeR,0,Math.PI*2); ctx.arc(e2x,e2y,eyeR,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(e1x-fx*eyeR*.35,e1y-fy*eyeR*.35,eyeR*.35,0,Math.PI*2); ctx.arc(e2x-fx*eyeR*.35,e2y-fy*eyeR*.35,eyeR*.35,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#17364b'; ctx.lineWidth=unit*.045; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(e1x-sx*eyeR,e1y-sy*eyeR-fy*eyeR*.6); ctx.lineTo(e1x+sx*eyeR,e1y+sy*eyeR-fy*eyeR*.6); ctx.moveTo(e2x-sx*eyeR,e2y-sy*eyeR-fy*eyeR*.6); ctx.lineTo(e2x+sx*eyeR,e2y+sy*eyeR-fy*eyeR*.6); ctx.stroke();
    ctx.strokeStyle='#ff7891'; ctx.lineWidth=unit*.035; ctx.beginPath(); ctx.moveTo(hx+fx*unit*.31,hy+fy*unit*.31); ctx.lineTo(hx+fx*unit*.45,hy+fy*unit*.45); ctx.stroke();
    ctx.restore();
    particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
    if(scorePulse>.03){ctx.globalAlpha=scorePulse;ctx.fillStyle='#ffe6a6';ctx.font='800 26px system-ui';ctx.textAlign='center';ctx.fillText('+1',food.x*unit+unit/2,food.y*unit+unit/2-18-scorePulse*20);ctx.globalAlpha=1;}
    const shade=ctx.createLinearGradient(0,0,0,canvas.height); shade.addColorStop(0,'rgba(255,255,255,.03)'); shade.addColorStop(.5,'rgba(255,255,255,0)'); shade.addColorStop(1,'rgba(0,0,0,.18)'); ctx.fillStyle=shade; ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  function rounded(x,y,s,r) { ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+s,y,x+s,y+s,r); ctx.arcTo(x+s,y+s,x,y+s,r); ctx.arcTo(x,y+s,x,y,r); ctx.arcTo(x,y,x+s,y,r); ctx.closePath(); }
  function show(pill,title,text,button) { statePill.textContent=pill; overlayTitle.textContent=title; overlayText.textContent=text; overlayButton.textContent=button; overlay.classList.remove('hidden'); }
  function hide() { overlay.classList.add('hidden'); }
  overlayButton.addEventListener('click', () => { if (state === 'ready') start(); else if (state === 'paused') togglePause(); else if (state === 'gameover') reset(); });
  pauseButton.addEventListener('click', togglePause); restartButton.addEventListener('click', reset);
  document.addEventListener('keydown', e => {
    const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',W:'up',s:'down',S:'down',a:'left',A:'left',d:'right',D:'right'};
    if (map[e.key]) { e.preventDefault(); setDirection(map[e.key]); }
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  });
  document.querySelectorAll('[data-dir]').forEach(b => b.addEventListener('click', () => setDirection(b.dataset.dir)));
  musicButton.addEventListener('click',()=>{musicOn=!musicOn;musicButton.textContent=musicOn?'♫ 音乐：开':'♫ 音乐：关';musicButton.classList.toggle('audio-on',musicOn);if(musicOn&&state==='running')startMusic();else{clearInterval(musicTimer);if(audioCtx)audioCtx.suspend();}});
  reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
